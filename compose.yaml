services:
  chatgpt-codex-proxy:
    build: .
    container_name: chatgpt-codex-proxy
    restart: unless-stopped
    environment:
      PORT: "${PORT:-8080}"
      PROXY_API_KEY: "${PROXY_API_KEY:?set PROXY_API_KEY in .env or the shell environment}"
      DEBUG_LOG_PAYLOADS: "${DEBUG_LOG_PAYLOADS:-false}"
      DATA_DIR: /app/data
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - chatgpt-codex-proxy-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  chatgpt-codex-proxy-data:
